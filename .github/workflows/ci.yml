name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Testy (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Konfiguracja Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Uruchomienie testów
        run: pytest tests/ -q --tb=short

  benchmark:
    name: Analiza wydajności (quick)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalacja zależności
        run: pip install -r requirements.txt

      - name: Benchmark
        run: python scripts/run_benchmark.py --quick --output benchmarks/results.json

      - name: Publikacja wyników benchmarku
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results.json
          if-no-files-found: error
